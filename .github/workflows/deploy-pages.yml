name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # GitHub Pages is static HTML only — APIs and middleware cannot be exported.
      - name: Strip server-only routes for static export
        run: |
          rm -rf src/app/api
          rm -f src/middleware.ts
      - run: npm run build
        env:
          CI: "true"
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/dandybags"
          AUTH_SECRET: "github-pages-static-placeholder-secret"
      - name: Allow _next assets on GitHub Pages
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
